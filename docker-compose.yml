      context: ./ms-ordenes
    container_name: ms-ordenes
    restart: always
    depends_on:
      mysql-bookhub:
        condition: service_healthy
      ms-catalogo:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-bookhub:3306/bbdd_ordenes?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      MS_CATALOGO_URL: http://ms-catalogo:8084

  ms-pagos:
